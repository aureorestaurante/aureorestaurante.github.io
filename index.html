<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f6f1">
  <meta name="description" content="Carta de alérgenos del Restaurante Áureo.">
  <title>Áureo | Carta de alérgenos</title>
  <style>
    :root{color-scheme:light; font-family:Georgia,'Times New Roman',serif;color:#28251f;background:#f8f6f1}
    *{box-sizing:border-box} body{margin:0} header{text-align:center;padding:24px 16px 20px}
    .mark{font-size:clamp(32px,7vw,48px);letter-spacing:.22em;font-weight:400;margin:0 0 6px}
    .sub{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.3em;color:#786e5b;text-transform:uppercase}
    h1{font-size:17px;font-weight:normal;margin:18px 0 12px}
    a.btn{display:inline-block;background:#29271f;color:#fff;text-decoration:none;font:14px Arial,sans-serif;padding:12px 20px;border-radius:3px}
    p.hint{font:12px Arial,sans-serif;color:#635f57;padding:0 12px;line-height:1.6}
    main{max-width:1050px;margin:0 auto;padding:0 12px 20px}
    iframe{display:block;width:100%;height:75vh;min-height:500px;border:1px solid #e5e0d8;background:white}
    footer{text-align:center;font:11px Arial,sans-serif;color:#777166;padding:8px 0 20px}
    @media(max-width:640px){header{padding-top:26px}iframe{height:72vh;min-height:430px}}
  </style>
</head>
<body>
<header>
  <div class="mark">ÁUREO</div>
  <div class="sub">Restaurante</div>
  <h1>Carta de alérgenos / Allergen information</h1>
  <a class="btn" href="carta-alergenos.pdf" target="_blank" rel="noopener">Abrir carta de alérgenos (PDF)</a>
  <p class="hint">Si no puedes visualizar la carta en esta página, pulsa el botón para abrir el documento.</p>
</header>
<main><iframe src="carta-alergenos.pdf#toolbar=1" title="Carta de alérgenos del Restaurante Áureo"></iframe></main>
<footer>Restaurante Áureo · Información de alérgenos</footer>
</body>
</html>
